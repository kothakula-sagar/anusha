<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<style>
  :root{--gold:#ffe08a;--mint:#9ff5e4;--rose:#ff8fc7;--lilac:#c9a8ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;
    background:linear-gradient(165deg,#150a33,#3a1f6e 45%,#b2509a 85%,#ffb38a);background-attachment:fixed;overflow:hidden;
  }
  #bgstars{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),
      radial-gradient(2px 2px at 40% 70%,#ffd9ff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),
      radial-gradient(2px 2px at 10% 80%,#cfe3ff,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent),
      radial-gradient(2.5px 2.5px at 92% 12%,#fff4c2,transparent),radial-gradient(1.5px 1.5px at 30% 12%,#fff,transparent);
    background-size:320px 320px;animation:tw 3.2s ease-in-out infinite alternate;
  }
  @keyframes tw{from{opacity:.35}to{opacity:1}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .screen{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;position:relative;z-index:5}
  .screen.active{display:flex;animation:fade .8s ease}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h1{font-size:clamp(2.2rem,9vw,4.5rem);line-height:1.05;text-shadow:0 0 22px rgba(255,200,255,.65),0 4px 0 rgba(0,0,0,.18)}
  h1 .name{display:block;color:var(--gold);font-size:1.15em;text-shadow:0 0 26px rgba(255,224,138,.8)}
  p.sub{margin-top:14px;font-size:clamp(1rem,3.8vw,1.3rem);opacity:.94;max-width:560px}
  .btn{
    margin-top:22px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:1.15rem;
    padding:14px 30px;border-radius:999px;color:#3a0f4d;
    background:linear-gradient(135deg,#ffe9a8,#ffc2e6);
    box-shadow:0 0 24px rgba(255,200,240,.55),0 8px 22px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03)}
  .btn:active{transform:translateY(2px)}
  .btn.alt{background:linear-gradient(135deg,#b8f3ff,#d9c2ff)}
  .emoji-float{font-size:3.2rem;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,230,160,.8))}
  @keyframes bob{50%{transform:translateY(-14px) rotate(6deg)}}
  .hint{margin-top:24px;font-size:1rem;opacity:.9}
  .count{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}
  .cbox{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);border-radius:20px;padding:14px 10px;min-width:72px;backdrop-filter:blur(8px);box-shadow:0 0 22px rgba(201,168,255,.35)}
  .cbox b{display:block;font-size:clamp(1.8rem,8vw,2.6rem);color:var(--gold);text-shadow:0 0 14px rgba(255,224,138,.7)}
  .cbox span{font-size:.85rem;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
  .peek{margin-top:26px;font-size:.8rem;color:#fff;opacity:.35;text-decoration:none}

  /* 3D stage + overlays */
  #stage{position:fixed;inset:0;display:none;z-index:1;background:#150a33}
  #stage canvas{display:block;width:100%;height:100%}
  #caption{
    position:fixed;top:8%;left:50%;transform:translateX(-50%);z-index:55;width:92vw;max-width:760px;
    font-size:clamp(1.3rem,5.6vw,2.5rem);font-weight:800;text-align:center;line-height:1.2;
    text-shadow:0 0 20px rgba(255,200,255,.8),0 3px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .6s;pointer-events:none;
  }
  #caption.on{opacity:1}
  #memcap{
    position:fixed;bottom:13%;left:50%;transform:translate(-50%,16px);z-index:55;
    background:rgba(30,12,60,.62);border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);
    padding:10px 20px;border-radius:18px;font-weight:700;font-size:clamp(1rem,4vw,1.35rem);
    box-shadow:0 0 24px rgba(201,168,255,.4);opacity:0;transition:.5s;pointer-events:none;text-align:center;max-width:90vw;
  }
  #memcap.on{opacity:1;transform:translate(-50%,0)}
  #act{position:fixed;bottom:6%;left:0;right:0;text-align:center;z-index:56;pointer-events:none}
  #act .btn{pointer-events:auto;margin-top:0;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 38px rgba(255,220,250,.9),0 8px 22px rgba(0,0,0,.35)}}
  #mute{
    position:fixed;top:14px;right:14px;z-index:60;display:none;width:44px;height:44px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.45);background:rgba(30,12,60,.55);color:#fff;font-size:1.2rem;cursor:pointer;backdrop-filter:blur(6px);
  }
  #final{
    position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(20,8,50,.55);backdrop-filter:blur(4px);
  }
  #final.on{display:flex;animation:fade .9s ease}
  .card{
    background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.45);
    border-radius:28px;padding:26px 22px;max-width:560px;width:100%;text-align:center;
    box-shadow:0 0 50px rgba(201,168,255,.45),0 20px 50px rgba(0,0,0,.4);max-height:92vh;overflow:auto;
  }
  .card h2{color:var(--gold);font-size:1.8rem;margin-bottom:12px;text-shadow:0 0 18px rgba(255,224,138,.7)}
  .card p{font-size:1.08rem;line-height:1.6;white-space:pre-line}
  .sign{margin-top:16px;font-weight:700;color:var(--mint)}
  #err{display:none;position:fixed;inset:0;z-index:99;background:#1a0a30;align-items:center;justify-content:center;text-align:center;padding:24px}
/* Softer presentation and touch-friendly controls. */
  body{background:linear-gradient(160deg,#100e22,#302342 60%,#76505f);}
  h1,h1 .name{text-shadow:0 3px 24px rgba(0,0,0,.25)}
  .btn{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;box-shadow:0 6px 24px #0004}
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible,#mute:focus-visible,.peek:focus-visible{outline:3px solid #ffe08a;outline-offset:5px}
  #act .btn{animation:none} #caption{text-shadow:0 2px 14px #0009;top:max(65px,7%)}
  .screen{min-height:100svh}.peek{opacity:.7}.card{background:rgba(35,25,47,.82)}
  @media(prefers-reduced-motion:reduce){.screen.active,.emoji-float,#bgstars,#final.on{animation:none}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.THREE_FAILED=true"></script>
<script>
const $ = id => document.getElementById(id);
const screens = ["s0","s1"];
function show(id){ screens.forEach(s => $(s).classList.toggle("active", s===id)); }
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- text ---------- */
$("nm1").textContent = CONFIG.name + "! 🎂";
$("intro").textContent = CONFIG.intro;
$("msgTitle").textContent = "Dear " + CONFIG.name + " 💌";
$("msgText").textContent = CONFIG.message;
$("sign").textContent = "With love, " + CONFIG.from;
document.title = "Happy Birthday " + CONFIG.name + "!";

/* ---------- sound (synthesized) ---------- */
let actx;
function tone(freq, dur=0.12, type="triangle", vol=0.15, when=0, slideTo=null){
  if(!musicOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + when;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.linearRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const fanfare = () => [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.28,"square",0.08,i*0.12));
const chime = () => [784,988,1175,1568,1976].forEach((f,i)=>tone(f,0.9,"sine",0.07,i*0.09));
const thump = () => tone(110,0.12,"sine",0.35);
const creak = () => tone(140,1.2,"sawtooth",0.05,0,260);
const step = () => tone(70+Math.random()*20,0.07,"sine",0.1);
const boom = () => { tone(130,.35,"sawtooth",.07,0,40); tone(900,.2,"square",.03,.05,300); };

/* gentle original music-box ambience (random pentatonic notes) */
let musicOn = true, musicTimer = null;
const SCALE = [523.25,587.33,659.25,783.99,880,1046.5,1174.66];
function startMusic(){
  if(musicTimer) return; let i = 0;
  $("mute").style.display = "block";
  musicTimer = setInterval(()=>{
    if(!musicOn) return;
    const f = SCALE[(Math.random()*SCALE.length)|0];
    tone(f,1.3,"sine",0.045);
    if(i%4===0) tone(f/2,1.8,"triangle",0.03);
    if(i%8===0) tone(SCALE[(Math.random()*4)|0]*2,1.6,"sine",0.025,.25);
    i++;
  }, 540);
}
$("mute").onclick = () => { musicOn = !musicOn; $("mute").textContent = musicOn ? "🔊" : "🔇"; };

/* ---------- 2D confetti overlay ---------- */
const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], raining = 0;
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", size); size();
const COLORS = ["#ff8fc7","#ffe08a","#9ff5e4","#c9a8ff","#ffffff","#ffb38a"];
function burst(x=innerWidth/2, y=innerHeight/2, n=120){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 4+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:6+Math.random()*7,h:4+Math.random()*6,
      c:COLORS[(Math.random()*COLORS.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:140+Math.random()*60});
  }
}
function rainConfetti(){
  for(let i=0;i<8;i++) parts.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,w:7,h:5,
    c:COLORS[(Math.random()*COLORS.length)|0],r:0,vr:(Math.random()-.5)*.3,life:260});
}
let confettiLast = performance.now(), rainBudget = 0;
(function loop2d(now=performance.now()){
  const tick = Math.min(3, Math.max(0,(now-confettiLast)/16.6667)); confettiLast=now;
  cx.clearRect(0,0,cv.width,cv.height);
  if(raining>0){ rainBudget += tick; while(rainBudget>=1){rainConfetti();rainBudget--;} raining=Math.max(0,raining-tick); }
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy += 0.18*tick; p.vx *= Math.pow(.99,tick); p.x += p.vx*tick; p.y += p.vy*tick; p.r += p.vr*tick; p.life-=tick;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    cx.globalAlpha = Math.min(1,p.life/40); cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
  }
  requestAnimationFrame(loop2d);
})();

/* ---------- countdown + midnight unlock ---------- */
(function(){
  const d = CONFIG.birthday.split("-").map(Number);
  const unlockAt = CONFIG.testCountdownSeconds > 0
    ? Date.now() + CONFIG.testCountdownSeconds * 1000
    : new Date(d[0], d[1]-1, d[2], 0, 0, 0).getTime();
  const preview = location.search.includes("preview");
  let timer;
  function tick(){
    const left = unlockAt - Date.now();
    if(left <= 0){ clearInterval(timer); show("s1"); burst(innerWidth/2, innerHeight/2, 200); raining = 80; chime(); return; }
    const s = Math.floor(left/1000);
    $("cd").textContent = Math.floor(s/86400);
    $("ch").textContent = Math.floor(s%86400/3600);
    $("cm").textContent = Math.floor(s%3600/60);
    $("cs").textContent = s%60;
  }
  if(preview || Date.now() >= unlockAt){ show("s1"); }
  else { tick(); timer = setInterval(tick, 1000); }
})();

/* ======================================================
   3D WORLD  (dreamy & magical)
   ====================================================== */
let renderer, scene, camera, char, door, doorGlow, frames = [], balloons = [], lanterns = [], spinners = [], twinklers = [];
let flames = [], cakeLight, sliceGroup, plateMesh, magicCircle, flies, tweens = [];
let walking = false, walkPhase = 0, camMode = "outside", clock = 0, started = false, trailT = 0, blinkT = 2, GLOW;
let fireworksOn = false, fwT = 0;
let lookCur, camTarget, lookTarget;
const PAL = [0xffffff,0xffd1f0,0xd9c2ff,0xfff3a8,0xb8f3ff,0xffb3d1];

const mat = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.65, metalness:.05}, o));
function addBox(w,h,d,c,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c)); m.position.set(x,y,z); (parent||scene).add(m); return m; }
function addPlane(w,h,material,x,y,z,ry=0,rx=0){
  const geo = new THREE.PlaneGeometry(w,h), tile = material.userData && material.userData.tile;
  if(tile){ const uv = geo.attributes.uv; for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*w/tile, uv.getY(i)*h/tile); }   // texture covers `tile` world units
  const m = new THREE.Mesh(geo, material);
  m.position.set(x,y,z); m.rotation.set(rx,ry,0); scene.add(m); return m;
}
const dbl = (c,o={}) => mat(c,Object.assign({side:THREE.DoubleSide},o));
const lerp = (a,b,t) => a + (b-a)*t;

function canvasTex(w,h,draw){
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"),w,h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function glowTex(){
  return canvasTex(128,128,(g)=>{
    const r = g.createRadialGradient(64,64,0,64,64,64);
    r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.25,"rgba(255,255,255,.55)"); r.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0,0,128,128);
  });
}
function glow(color, sz, x, y, z, parent, opacity=1){
  const m = new THREE.SpriteMaterial({map:GLOW,color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
  const s = new THREE.Sprite(m); s.scale.set(sz,sz,1); s.position.set(x,y,z); (parent||scene).add(s); return s;
}
function textTex(text, w, h, bg, fg, fontPx){
  return canvasTex(w,h,(g)=>{
    if(bg){ g.fillStyle = bg; g.fillRect(0,0,w,h); }
    let px = fontPx; g.font = "800 " + px + "px Trebuchet MS, Arial";
    while(g.measureText(text).width > w*0.92 && px > 14){ px -= 4; g.font = "800 " + px + "px Trebuchet MS, Arial"; }
    g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, w/2, h/2);
  });
}
function placeholderTex(i){
  return canvasTex(512,372,(g)=>{
    const hue = (i*47+260)%360, grd = g.createLinearGradient(0,0,512,372);
    grd.addColorStop(0,"hsl("+hue+",75%,70%)"); grd.addColorStop(1,"hsl("+((hue+60)%360)+",75%,58%)");
    g.fillStyle = grd; g.fillRect(0,0,512,372);
    g.font = "130px serif"; g.textAlign="center"; g.textBaseline="middle";
    g.fillText(["📸","🎈","🍰","🎉","✨","🎁","🥳","💛"][i%8], 256, 150);
    g.fillStyle="rgba(255,255,255,.95)"; g.font="800 26px Trebuchet MS, Arial"; g.fillText("Memory " + (i+1), 256, 270);
    g.font="600 18px Trebuchet MS, Arial"; g.fillText("(add images/wall-poster-"+(i+1)+".png)", 256, 310);
  });
}
function starShape(outer, inner, pts=5){
  const s = new THREE.Shape();
  for(let i=0;i<pts*2;i++){
    const r = i%2 ? inner : outer, a = i/(pts*2)*Math.PI*2 + Math.PI/2;
    i ? s.lineTo(Math.cos(a)*r, Math.sin(a)*r) : s.moveTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  s.closePath(); return s;
}
function starMesh(size, color){
  const g = new THREE.ExtrudeGeometry(starShape(1,.45),{depth:.25,bevelEnabled:false}); g.translate(0,0,-.125); g.scale(size,size,size);
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({color}));
}

/* ----- realistic surface textures (drawn on canvas, no files needed) ----- */
function texMat(tex, tile, o={}){
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = 4;
  const m = new THREE.MeshStandardMaterial(Object.assign({map:tex, roughness:.8, metalness:0}, o));
  m.userData.tile = tile; return m;
}
function woodTex(){
  return canvasTex(512,512,(g,w,h)=>{
    const pl = 8, pw = w/pl;
    for(let i=0;i<pl;i++){
      const x = i*pw, hue = 24+Math.random()*10, l = 30+Math.random()*12;
      g.fillStyle = "hsl("+hue+",46%,"+l+"%)"; g.fillRect(x,0,pw-2,h);
      for(let k=0;k<26;k++){
        g.strokeStyle = "rgba(50,25,8,"+(.04+Math.random()*.1)+")"; g.lineWidth = .6+Math.random()*1.2; g.beginPath();
        const xx = x+Math.random()*pw; g.moveTo(xx,0); g.bezierCurveTo(xx+Math.random()*5-2.5,h*.3,xx+Math.random()*5-2.5,h*.6,xx+Math.random()*3-1.5,h); g.stroke();
      }
      g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(x+pw-2,0,2,h);
      g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(x,Math.floor(Math.random()*h),pw-2,2);
    }
  });

/* ----- sparkle particle pool (everything magical goes through emit) ----- */
const S = {N:1800, i:0};
function initSparks(){
  S.pos = new Float32Array(S.N*3).fill(-999); S.col = new Float32Array(S.N*3); S.base = new Float32Array(S.N*3);
  S.vel = new Float32Array(S.N*3); S.life = new Float32Array(S.N); S.max = new Float32Array(S.N).fill(1); S.grav = new Float32Array(S.N);
  const geo = new THREE.BufferGeometry();
  S.pAttr = new THREE.BufferAttribute(S.pos,3); S.cAttr = new THREE.BufferAttribute(S.col,3);
  geo.setAttribute("position",S.pAttr); geo.setAttribute("color",S.cAttr);
  S.points = new THREE.Points(geo, new THREE.PointsMaterial({size:.3,map:GLOW,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  S.points.frustumCulled = false; scene.add(S.points);
}
function emit(x,y,z,n,o={}){
  const speed = o.speed ?? 1.5, life = o.life ?? 1.2, grav = o.grav ?? .5, up = o.up ?? 0, jit = o.jitter ?? .2, c = new THREE.Color();
  for(let k=0;k<n;k++){
    const j = (S.i++) % S.N, b = j*3; let vx, vy, vz;
    if(o.sphere){ const u = Math.random()*2-1, a = Math.random()*6.283, r = Math.sqrt(1-u*u), s = speed*(.55+Math.random()*.45); vx = r*Math.cos(a)*s; vy = u*s; vz = r*Math.sin(a)*s; }
    else { const a = Math.random()*6.283, s = speed*Math.random(); vx = Math.cos(a)*s; vz = Math.sin(a)*s; vy = up*(.6+Math.random()*.8); }
    S.pos[b] = x+(Math.random()-.5)*jit; S.pos[b+1] = y+(Math.random()-.5)*jit; S.pos[b+2] = z+(Math.random()-.5)*jit;
    S.vel[b] = vx; S.vel[b+1] = vy; S.vel[b+2] = vz;
    c.set(o.color ?? PAL[(Math.random()*PAL.length)|0]); S.base[b] = c.r; S.base[b+1] = c.g; S.base[b+2] = c.b;
    S.life[j] = S.max[j] = life*(.7+Math.random()*.6); S.grav[j] = grav;
  }
}
function updateSparks(dt){
  for(let j=0;j<S.N;j++){
    if(S.life[j] <= 0) continue;
    const b = j*3; S.life[j] -= dt;
    if(S.life[j] <= 0){ S.pos[b+1] = -999; S.col[b] = S.col[b+1] = S.col[b+2] = 0; continue; }
    S.vel[b+1] -= S.grav[j]*dt;
    S.pos[b] += S.vel[b]*dt; S.pos[b+1] += S.vel[b+1]*dt; S.pos[b+2] += S.vel[b+2]*dt;
    const k = Math.min(1, S.life[j]/S.max[j]*1.6);
    S.col[b] = S.base[b]*k; S.col[b+1] = S.base[b+1]*k; S.col[b+2] = S.base[b+2]*k;
  }
  S.pAttr.needsUpdate = true; S.cAttr.needsUpdate = true;
}

const fx = [], spriteMats = {};

function spriteTex(draw){

function baseSpriteMat(kind,color){

    const heart = kind === "heart";
    spriteMats[key] = new THREE.SpriteMaterial({map: heart ? heartTex : starTex, color: heart ? 0xffffff : color, transparent:true, depthWrite:false, fog:false, blending: heart ? THREE.NormalBlending : THREE.AdditiveBlending});

function spawnFx(kind,color,pos,vel,life,size,grav=0){

function updateFx(dt){

  const s = new THREE.Shape(); s.moveTo(0,0); s.absarc(0,0,r,a0,a1,false); s.lineTo(0,0);
  const g = new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:10});

}

/* ----- tweens / movement ----- */
function tween(dur, fn){ return new Promise(res => tweens.push({t:0, dur, fn, res})); }
const easeOut = t => 1 - Math.pow(1-t,3);
const easeInOut = t => t*t*t*(t*(t*6-15)+10);
const damp = (rate,dt) => 1-Math.exp(-rate*dt);
function faceTo(x,z){
  const dx = x - char.g.position.x, dz = z - char.g.position.z;
  char.g.rotation.y = Math.atan2(-dx, -dz);
}
async function walkTo(x,z,speed=2.4){
  const p0 = char.g.position.clone();
  const dist = Math.hypot(x-p0.x, z-p0.z); if(dist < .01) return;
  await turnTo(x,z,.4); walking = true;
  // Short acceleration/deceleration ramps, with constant speed through most of the path.
  const ramp=.12;
  await tween(dist/speed/(1-ramp), t => {
    const u=t<ramp ? t*t/(2*ramp) : t>1-ramp ? 1-ramp-(1-t)*(1-t)/(2*ramp) : t-ramp/2;
    const e=u/(1-ramp);
    char.g.position.x=lerp(p0.x,x,e); char.g.position.z=lerp(p0.z,z,e);
  });
  walking = false;
}
async function turnTo(x,z,dur=.6){
  const a0 = char.g.rotation.y;
  const dx = x - char.g.position.x, dz = z - char.g.position.z;
  let a1 = Math.atan2(-dx,-dz); while(a1-a0 > Math.PI) a1 -= Math.PI*2; while(a1-a0 < -Math.PI) a1 += Math.PI*2;
  await tween(dur, t => char.g.rotation.y = lerp(a0,a1,easeInOut(t)));
}

/* ----- overlays ----- */
let capT, memT;
function say(text, ms=2600){ const c = $("caption"); c.textContent = text; c.classList.add("on"); clearTimeout(capT); if(ms) capT = setTimeout(()=>c.classList.remove("on"), ms); }
function memSay(text){ const m = $("memcap"); m.textContent = text; m.classList.add("on"); clearTimeout(memT); memT = setTimeout(()=>m.classList.remove("on"), 2600); }
function ask(label, cls=""){
  return new Promise(res=>{
    const b = document.createElement("button"); b.className = "btn " + cls; b.textContent = label;
    b.onclick = () => { $("act").innerHTML = ""; res(); };
    $("act").innerHTML = ""; $("act").appendChild(b);
  });
}

/* ----- main loop ----- */
let last = performance.now();
let _v;
let gaitSpeed=0, previousWalkPosition;
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(.05,(now-last)/1000); last = now;
  if(document.hidden) return;
  clock += dt;

  for(let i=tweens.length-1;i>=0;i--){
    const tw = tweens[i]; tw.t += dt;
    const p = Math.min(1, tw.t/tw.dur); tw.fn(p);
    if(p>=1){ tweens.splice(i,1); tw.res(); }
  }
  // walking animation + sparkle trail
  if(walking){
    const distance=previousWalkPosition ? char.g.position.distanceTo(previousWalkPosition) : 0;
    gaitSpeed=lerp(gaitSpeed,Math.min(3,distance/Math.max(dt,.001)),damp(12,dt));
    const prev = walkPhase; walkPhase += distance*3.8;
    const s = Math.sin(walkPhase)*.48*Math.min(1,gaitSpeed/1.8);
    char.lLeg.rotation.x = s; char.rLeg.rotation.x = -s;
    if(!char.armLock){ char.lArm.rotation.x = -s*.8; char.rArm.rotation.x = char.carry ? 1.2 : s*.8; }
    char.g.position.y = (1-Math.cos(walkPhase*2))*.018*Math.min(1,gaitSpeed/1.8);
    if(Math.floor(prev/Math.PI) !== Math.floor(walkPhase/Math.PI)) step();
    trailT += dt; if(trailT > .04){ trailT = 0; emit(char.g.position.x, .1, char.g.position.z, 2, {speed:.5, up:.7, life:1.1, grav:-.1}); }
  } else {
    char.lLeg.rotation.x *= Math.exp(-10*dt); char.rLeg.rotation.x *= Math.exp(-10*dt); if(!char.jumpLock) char.g.position.y *= Math.exp(-13*dt);
    if(!char.armLock){ char.lArm.rotation.x *= Math.exp(-10*dt); char.rArm.rotation.x = char.carry ? lerp(char.rArm.rotation.x,1.2,damp(13,dt)) : char.rArm.rotation.x*Math.exp(-10*dt); }
  }
  previousWalkPosition.copy(char.g.position); previousWalkPosition.y=0;
  // wings flap, head sway, blinking, wand sparkle
  const flap = Math.sin(clock*(walking?9:3.2))*.28;
  char.wingR.rotation.y = -(.5+flap); char.wingL.rotation.y = .5+flap;
  char.head.rotation.z = Math.sin(clock*2)*.03;
  // fireworks over the house while she walks up to the door
  fireworksOn = camMode === "outside";
  if(fireworksOn){
    fwT -= dt;
    if(fwT <= 0){ fwT = .6+Math.random()*.8;
      firework((Math.random()-.5)*30, 7+Math.random()*4, -6-Math.random()*12, [0xff8fc7,0xffe08a,0x9ff5e4,0xc9a8ff,0xb8d8ff][(Math.random()*5)|0]); }
  }
  updateFx(dt);
  blinkT -= dt; const bl = blinkT < 0 && blinkT > -.13 ? .1 : 1; char.eyes.forEach(e=>e.scale.y = bl); if(blinkT < -.13) blinkT = 2+Math.random()*3;
  if(Math.random() < 1-Math.exp(-18*dt)){ char.wandTip.getWorldPosition(_v); emit(_v.x,_v.y,_v.z,1,{speed:.25,up:.15,life:.9,grav:.6,jitter:.08,color:0xfff0a0}); }

  // ambient animation
  balloons.forEach(b=>{ b.g.position.y = b.base + Math.sin(clock*b.sp + b.ph)*.18; b.g.rotation.z = Math.sin(clock*b.sp*.7+b.ph)*.06; });
  lanterns.forEach(l=>{
    if(l.mode==="rise"){ l.g.position.y += l.rise*dt; l.g.position.x += Math.sin(clock*.3+l.ph)*.24*dt; if(l.g.position.y > 20) l.g.position.y = 3; }
    else l.g.position.y = l.base + Math.sin(clock*l.sp+l.ph)*.12;
  });
  spinners.forEach(s=>{ s.m.rotation.y += s.sp*dt; s.m.rotation.z = Math.sin(clock+s.sp)*.15; s.g.position.copy(s.m.position); s.g.material.opacity = .45+Math.sin(clock*2+s.sp*5)*.25; });
  twinklers.forEach(t=>{ t.m.opacity = .5 + Math.sin(clock*1.8+t.ph*2)*.22; });
  magicCircle.rotation.z += dt*.12; magicCircle.material.opacity = .45 + Math.sin(clock*1.5)*.15;
  flames.forEach((f,i)=>{ if(f.visible && !f.userData.extinguishing){ const s = 1 + Math.sin(clock*11+i*2)*.06; f.scale.set(s,1+Math.sin(clock*14+i)*.1,s); f.rotation.z=Math.sin(clock*8+i)*.055; } });
  if(cakeLight && !cakeLight.userData.extinguishing && flames.some(f=>f.visible)){ cakeLight.intensity = 1.1 + Math.sin(clock*15)*.12; if(Math.random()<1-Math.exp(-15*dt)) emit(0,2.35,-37,1,{speed:.9,up:.5,life:1.4,grav:-.05,jitter:.9}); }
  updateFireflies(); updateSparks(dt);

  // memory frames
  const cz = char.g.position.z;
  frames.forEach(f=>{
    const near = Math.abs(cz - f.z) < 2.8 && cz < 0;
    if(near && !f.shown){ f.shown = true; memSay(f.caption); chime2(); emit(f.grp.position.x*.8, 2.4, f.z, 24, {sphere:true, speed:1.2, life:1.3, grav:.1}); }
    f.active = near;
    f.grp.scale.setScalar(lerp(f.grp.scale.x, near ? 1.025 : 1, damp(5,dt)));
    f.halo.material.opacity = lerp(f.halo.material.opacity, near ? .28 : .12, damp(5,dt));
  });
  if(started && camMode==="outside" && cz < .8) camMode = "hall";
  updateCam(dt);
  renderer.render(scene, camera);
}
function chime2(){ tone(660,.1,"sine",.07); tone(880,.14,"sine",.06,.08); tone(1320,.18,"sine",.04,.16); }

function updateCam(dt){
  const c = char.g.position, sway = Math.sin(clock*.3)*.08;
  if(camMode==="outside"){ camTarget.set(c.x+3.2+sway,2.6,c.z+7); lookTarget.set(c.x,1.7,c.z-2); }
  else if(camMode==="hall"){ camTarget.set(sway*.5,2.7,c.z+5.6); lookTarget.set(0,1.8,c.z-4); }
  else { camTarget.set(3.6+sway*.6,3.1,-31.2); lookTarget.set(-.2,1.45,-36.2); }
  const k = 1 - Math.exp(-dt*(camMode==="cake" ? 1.6 : 4));
  camera.position.lerp(camTarget,k); lookCur.lerp(lookTarget,k); camera.lookAt(lookCur);
}

/* ----- scene actions ----- */
async function knock(){
  char.armLock = true;
  const armStart=char.rArm.rotation.x;
  await tween(.35,t=>char.rArm.rotation.x=lerp(armStart,1.5,easeInOut(t)));
  for(let i=0;i<3;i++){
    await tween(.18, t => char.rArm.rotation.x = lerp(1.5,2.0,easeInOut(t)));
    thump();
    await tween(.14, t => char.rArm.rotation.x = lerp(2.0,1.5,easeInOut(t)));
  }
  await tween(.3, t => char.rArm.rotation.x = lerp(1.5,0,t));
  char.armLock = false;
}
async function openDoor(){
  creak();
  const open = tween(1.5, t => door.rotation.y = easeOut(t)*1.75);
  setTimeout(()=>{
    chime();
    tween(2.2, t => { doorGlow.scale.setScalar(1+easeOut(t)*9); doorGlow.material.opacity = Math.sin(Math.min(1,t*1.3)*Math.PI)*.9; });
    for(let i=0;i<6;i++) setTimeout(()=>emit(0,1.7,-.4,30,{speed:2.2,up:1.2,life:1.6,grav:.3,jitter:1.2}), i*130);
  }, 400);
  await open;
}
async function twirl(){
  char.armLock = true;
  const a0 = char.g.rotation.y;
  await tween(1.5, p => {
    const e = easeInOut(p), f = 1 + Math.sin(p*Math.PI)*.3;
    char.g.rotation.y = a0 + Math.PI*2*e; char.skirt.scale.set(f,1,f);
    char.lArm.rotation.z = -Math.sin(p*Math.PI)*1.3; char.rArm.rotation.z = Math.sin(p*Math.PI)*1.3;
    emit(char.g.position.x, 1.0, char.g.position.z, 3, {speed:1.8, up:1.4, life:1.2, grav:.2});
  });
  char.skirt.scale.set(1,1,1); char.lArm.rotation.z = 0; char.rArm.rotation.z = 0; char.armLock = false;
}
async function blowCandles(){
  tone(300,.5,"sine",.12,0,120);
  cakeLight.userData.extinguishing=true;
  for(const f of flames){
    f.userData.extinguishing=true;
    emit(0,2.3,-37,0,{});
    await tween(.22, t => f.scale.setScalar(1-t));
    f.visible = false;
  }
  await tween(.5, t => cakeLight.intensity = lerp(1.1,.5,t));
  // wish orbs float up to the starry ceiling
  chime();
  for(let i=0;i<10;i++) setTimeout(()=>emit(0,2.3,-37,14,{speed:1.1,up:2.4,life:3,grav:-.15,jitter:.9}), i*140);
}
async function cutCake(){
  char.armLock = true; char.knife.visible = true;
  await tween(.6, t => { char.rArm.rotation.x = lerp(0,2.1,easeInOut(t)); });
  for(let i=0;i<2;i++){
    await tween(.35, t => char.rArm.rotation.x = lerp(2.1,1.35,easeInOut(t)));
    thump(); emit(0,2.1,-36.4,26,{sphere:true,speed:1.4,life:1,grav:.6});
    await tween(.3, t => char.rArm.rotation.x = lerp(1.35,2.1,easeInOut(t)));
  }
  const s0 = sliceGroup.position.clone();
  await tween(1.2, t => { const e = easeInOut(t); sliceGroup.position.set(s0.x+1.7*e, Math.sin(t*Math.PI)*.25, s0.z+.4*e); sliceGroup.rotation.y = e*.3; });
  emit(1.7,1.4,-35.9,40,{sphere:true,speed:1.6,life:1.3,grav:.5});
  for(let i=0;i<26;i++) spawnFx("heart",0xffffff,
    new THREE.Vector3((Math.random()-.5)*2.4, 1.8+Math.random()*.5, -37+(Math.random()-.5)*2),
    new THREE.Vector3((Math.random()-.5)*.8, 1+Math.random()*1.2, (Math.random()-.5)*.8), 2.8, .55, 0);
  await tween(.5, t => char.rArm.rotation.x = lerp(2.1,0,easeInOut(t)));
  char.knife.visible = false; char.armLock = false;
}
async function fireworks(n=8){
  const cols = [0xff8fc7,0xffe08a,0x9ff5e4,0xc9a8ff,0xb8d8ff,0xffb38a];
  for(let i=0;i<n;i++){
    emit(lerp(-5.5,5.5,Math.random()), lerp(3.2,4.2,Math.random()), lerp(-39.5,-34,Math.random()), 110, {sphere:true,speed:2.8,life:1.7,grav:1.3,color:cols[i%cols.length],jitter:.05});
    boom(); await wait(360);
  }
}
async function placeGift(){
  const gift = char.gift;
  scene.attach(gift);                                   // keep world position, detach from her hand
  const t0 = gift.position.clone(), t1 = new THREE.Vector3(-1.5,1.27,-37.4);
  await tween(.9, t => {
    const e = easeInOut(t);
    gift.position.set(lerp(t0.x,t1.x,e), lerp(t0.y,t1.y,e)+Math.sin(t*Math.PI)*.5, lerp(t0.z,t1.z,e));
    gift.rotation.set(0, e*.5, 0);
  });
  char.carry = false;
  sparkleBurst(t1.x, t1.y+.3, t1.z, 40); chime2(); chime();
}
async function jump(n=2){
  char.jumpLock=true;
  for(let i=0;i<n;i++){ await tween(.5, t => char.g.position.y = 4*t*(1-t)*.42); emit(char.g.position.x,.1,char.g.position.z,30,{sphere:true,speed:1.6,life:1,grav:.8}); }
  char.g.position.y = 0; char.jumpLock=false;
}

/* ----- the show ----- */
async function runShow(){
  started = true; camMode = "outside";
  startMusic();
  await wait(900);
  say(CONFIG.arriving, 3200);
  await walkTo(0,2.5,2.5);
  await wait(250);
  say("Knock knock! 🚪", 1800);
  await knock();
  await wait(350);
  await openDoor();
  await wait(250);
  await walkTo(0,-1.4,2.2);
  say("Welcome, " + CONFIG.name + "! 🎉", 3200);
  burst(innerWidth/2, innerHeight/2.2, 160); raining = 60; chime();
  await twirl();
  await wait(300);
  say("Take a stroll down Memory Lane 📸", 2600);
  await walkTo(0,-31.5,2.1);
  camMode="cake";
  await walkTo(-1.8,-35.2,2);
  await turnTo(0,-37);
  say("A little something for you 🎁", 2200);
  await placeGift();
  await wait(1200);
  say("Make a wish… (not for more work) 🌟", 0);
  await ask("Blow the candles 💨");
  $("caption").classList.remove("on");
  await blowCandles();
  burst(innerWidth/2, innerHeight/2, 120); fanfare();
  say("Wish sent to the stars. No takebacks! ✨", 2800);
  await wait(1800);
  await ask("Cut the cake 🔪");
  await cutCake();
  say("Cake secured. Now eat it before someone else does! 🍰", 0);
  burst(innerWidth/2, innerHeight/2, 260); raining = 140; fanfare();
  fireworks(8);
  await twirl();
  await jump(2);
  await wait(2200);
  $("caption").classList.remove("on");
  $("final").classList.add("on");
}

function showError(error){
  console.error(error);
  $("err").style.display="flex";
  $("err").querySelector("h2").textContent="The birthday scene could not start";
  $("err").querySelector("p").textContent="Please use a browser with WebGL enabled and check your internet connection, then refresh.";
}
/* ----- start ----- */
$("openBtn").onclick = () => {
  if(window.THREE_FAILED || typeof THREE === "undefined"){ $("err").style.display = "flex"; return; }
  if(started) return;
  started=true;
  chime();
  screens.forEach(s => $(s).classList.remove("active"));
  $("bgstars").style.display = "none";
  $("stage").style.display = "block";
  try{initThree(); runShow().catch(showError);}catch(e){showError(e);}
};
$("replay").onclick = () => { location.href = location.pathname + "?preview"; };
</script>
